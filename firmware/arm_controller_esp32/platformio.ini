; Firmware lengan 6-DOF, sketch AKTIF (lihat firmware/README.md).
;
;   pio run                               # compile saja
;   pio run -t upload -t monitor          # flash + serial monitor 115200
;   pio run -t upload --upload-port COM7  # kalau auto-detect salah tebak
;
; Butuh wifi_secrets.h di folder ini (salin dari wifi_secrets.h.example);
; file itu di-gitignore, build gagal dengan #error kalau belum ada.
;
; Folder ini sekaligus sketch Arduino IDE dan project PlatformIO: PlatformIO
; hanya mencari .ino di root src_dir dan tidak rekursif, jadi tiap sketch wajib
; punya platformio.ini sendiri, bukan satu ini bersama di firmware/.

[platformio]
src_dir = .

[env:arm]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	teemuatlut/TMCStepper@^0.7.3
	links2004/WebSockets@^2.4.1
	bblanchon/ArduinoJson@^6.21.5
	gin66/FastAccelStepper@^0.30.13
	madhephaestus/ESP32Servo@^3.0.5
