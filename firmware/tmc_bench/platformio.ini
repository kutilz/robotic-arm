; Bench 1 driver TMC2209 (lihat header tmc_bench.ino).
;
;   pio run -t upload -t monitor          # dari dalam folder ini
;
; Folder ini sekaligus sketch Arduino IDE dan project PlatformIO: PlatformIO
; hanya mencari .ino di root src_dir dan tidak rekursif, jadi tiap sketch wajib
; punya platformio.ini sendiri, bukan satu ini bersama di firmware/.

[platformio]
src_dir = .

[env:tmc_bench]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	teemuatlut/TMCStepper@^0.7.3
