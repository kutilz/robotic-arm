; Pemindai bus UART TMC2209, sketch diagnosis (lihat header tmc_scan.ino).
;
;   python tools/remote_build.py --project tmc_scan --env scan --upload-port COM3
;
; Sengaja TIDAK memakai TMCStepper: datagram dirakit sendiri supaya bisa
; melaporkan gagal-di-mana (echo rusak / tak menjawab / CRC / tabrakan), bukan
; cuma "conn != 0". Tanpa lib eksternal, compile-nya juga cepat.
;
; Folder ini sekaligus sketch Arduino IDE dan project PlatformIO: PlatformIO
; hanya mencari .ino di root src_dir dan tidak rekursif, jadi tiap sketch wajib
; punya platformio.ini sendiri, bukan satu ini bersama di firmware/.

[platformio]
src_dir = .

[env:scan]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
