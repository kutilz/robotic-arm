<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%E2%97%8E%3C/text%3E%3C/svg%3E" />
  <title>Cycloidal Arm Studio</title>
</head>
<body>
  <!-- Layout: 3D scene full-viewport, semua UI = panel floating di atasnya.
       Kontrak DOM (jangan ubah id/class, dipakai langsung oleh JS):
       #connBadge .dot/.lbl (net/bridge.js), #estop (main.js),
       id timeline (features/timeline.js). -->
  <div id="app">
    <main id="stage">

      <!-- kiri-atas: brand + view options (collapsible) -->
      <section id="scenePanel" class="fpanel"></section>

      <!-- kanan-atas: status TCP + koneksi -->
      <section id="statusCard" class="fpanel">
        <div class="scHead">
          <span class="scLogo">◎</span>
          <span class="scName">CYCLOIDAL 6-DOF</span>
          <div id="connBadge" class="badge off" title="Status koneksi bridge">
            <span class="dot"></span><span class="lbl">sim</span>
          </div>
        </div>
        <div class="scGrid" id="tcpGrid"></div>
        <div class="scFoot" id="hudFoot"></div>
      </section>

      <!-- kanan-bawah: kartu kontrol ber-tab + E-STOP -->
      <section id="controlCard" class="fpanel"></section>

      <!-- bawah-tengah: timeline pill -->
      <section id="timelineBar" class="fpanel empty"></section>

      <!-- kiri-bawah: icon strip (kamera, ortho, legend, engineering) -->
      <nav id="iconStrip"></nav>
      <div id="legendCard" class="fpanel"></div>
      <div id="hint">drag = orbit · scroll = zoom · shift+drag = pan</div>

      <!-- drawer engineering (slide dari kanan, hanya mode eng) -->
      <aside id="engDrawer" class="fpanel" aria-label="Panel engineering">
        <header class="engHead">
          <div>
            <div class="t">Engineering</div>
            <div class="s">parameter terkunci dari research (Pre-CAD)</div>
          </div>
          <button id="engClose" class="icobtn" title="Tutup engineering"></button>
        </header>
        <div id="engScroll"></div>
      </aside>

    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
