name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -v
      - name: Sanity-check sizing report
        run: python -m arm.torque
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Relay rules (Node, tanpa Cloudflare)
        run: node --test "relay/test/*.test.mjs"
      - name: Live stream + link quality rules (studio, tanpa peramban)
        run: |
          node studio/tools/verify_live.mjs
          node studio/tools/verify_net.mjs
